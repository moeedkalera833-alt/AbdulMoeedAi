
name: Build Abdul Moeed AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -o 4.App.zip.zip -d /tmp/app_extract

          APP_GRADLE="$(find /tmp/app_extract -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) -print -quit)"

          if [ -z "$APP_GRADLE" ]; then
            echo "app/build.gradle not found in ZIP"
            find /tmp/app_extract -maxdepth 7 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"

          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbdulMoeedAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
