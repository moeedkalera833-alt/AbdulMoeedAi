
name: Build Abdul Moeed AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Extract App ZIP
        run: |
          mkdir -p app
          unzip -o 4.App.zip.zip -d /tmp/app_extract
          if [ -f /tmp/app_extract/build.gradle ] || [ -f /tmp/app_extract/build.gradle.kts ]; then
            cp -a /tmp/app_extract/. app/
          elif [ -f /tmp/app_extract/app/build.gradle ] || [ -f /tmp/app_extract/app/build.gradle.kts ]; then
            cp -a /tmp
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build 

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbdulMoeedAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
