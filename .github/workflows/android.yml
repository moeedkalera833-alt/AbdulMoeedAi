
name: Build Abdul Moeed AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Extract App ZIP
        run: |
          mkdir -p app
          unzip -o 4.app.zip -d /tmp/app_extract
          if [ -f /tmp/app_extract/build.gradle ] || [ -f /tmp/app_extract/build.gradle.kts ]; then
            cp -a /tmp/app_extract/. app/
          elif [ -f /tmp/app_extract/app/build.gradle ] || [ -f /tmp/app_extract/app/build.gradle.kts ]; then
            cp -a /tmp/app_extract/app/. app/
          else
            echo "App Gradle file not found in ZIP"
            find /tmp/app_extract -maxdepth 4 -type f
            exit 1
          fi

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbdulMoeedAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
